        in: path
        name: task_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Task'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: 'NOT_FOUND: нет задачи, она удалена или пользователь не участник
            проекта'
          schema:
