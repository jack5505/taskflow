      description: 'Назначение себя и переход todo→in_progress одной транзакцией с
        блокировкой строки задачи (§8.4): из одновременных нажатий проходит одно.
        Задача уже у другого — 409 TASK_ALREADY_TAKEN (details.assignee); закрытая
        — 409 INVALID_TRANSITION. Повторный запрос того же исполнителя — 200 без изменений.'
      parameters:
