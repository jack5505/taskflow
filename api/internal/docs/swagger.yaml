      summary: Отчёт по спринту
      tags:
      - sprints
  /api/v1/sprints/{id}/start:
    post:
      description: 'Менеджер (§5.2). Под блокировкой проекта: в проекте нет активного
        (иначе 409 SPRINT_ALREADY_ACTIVE), даты заполнены, end позже start, не больше
        42 дней, в спринте есть задачи (иначе 409 INVALID_TRANSITION, details.reason:
        dates | empty | not_planned). Фиксирует объём на старте: задачи, сумма оценок,
        сколько без оценки.'
