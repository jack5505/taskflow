    get:
      description: 'Участник проекта (§5.6, §9.2); только active и closed, у planned
        — 409 INVALID_TRANSITION (details.reason = planned). Объём на старте (без
        оценки: without_estimate) и сейчас (у завершённого — на момент закрытия),
        задачи, добавленные и убранные после старта, списанное время по исполнителям,
        берндаун: точка на каждый день спринта из ежедневных снимков (remaining_hours
        = null — снимка за день нет) и идеальная прямая от объёма на старте до нуля.'
      parameters:
      - description: id спринта
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sprint.Report'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: INVALID_TRANSITION
