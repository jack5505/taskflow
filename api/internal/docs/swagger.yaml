        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.WorklogView'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Записи времени задачи
      tags:
      - worklogs
    post:
      consumes:
      - application/json
      description: |-
        Исполнитель задачи или менеджер проекта (§2), запись — от имени текущего пользователя (source manual, через бота — telegram).
        duration — §6.1 («2h 30m», «45m», «3h», «1d» = 8h), от 1m до 24h, иначе 400 INVALID_DURATION. work_date — не позже сегодня и не раньше даты создания задачи по поясу пользователя (§3.5).
        Сумма записей пользователя за дату по всем задачам — не больше 24 часов (§6.3), иначе 409 DAILY_LIMIT_EXCEEDED (в details used_minutes и available_minutes).
        Отменённая задача и задача закрытого спринта (§4, §6.5) — 409 INVALID_TRANSITION. spent_minutes задачи пересчитывается, version не меняется. Событие worklog.created.
      parameters:
      - description: ключ задачи
        in: path
        name: task_key
        required: true
        type: string
      - description: запись
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.worklogRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task.WorklogView'
        "400":
          description: INVALID_DURATION, VALIDATION_FAILED (work_date, comment), INVALID_JSON
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не исполнитель и не менеджер'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: DAILY_LIMIT_EXCEEDED, INVALID_TRANSITION, PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Списать время
      tags:
      - worklogs
  /api/v1/telegram/webhook:
    post:
      consumes:
      - application/json
      description: Приём обновлений бота (§8.8). Секрет в X-Telegram-Bot-Api-Secret-Token
        проверяется на каждом запросе. Ответ 200 отдаётся сразу, обработка идёт в
        очереди; повторно доставленный update_id (24 часа) не обрабатывается. Маршрут
        есть, только если задан TELEGRAM_BOT_TOKEN и бот работает в режиме webhook.
      parameters:
      - description: секрет webhook
        in: header
        name: X-Telegram-Bot-Api-Secret-Token
        required: true
        type: string
      - description: Update из Bot API
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 'ok: true'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: неверный секрет
          schema:
            $ref: '#/definitions/apierr.Response'
        "413":
          description: PAYLOAD_TOO_LARGE
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Webhook Telegram
      tags:
      - telegram
  /api/v1/users:
    get:
      description: Администратору — все пользователи целиком (user.User). Менеджеру
        проекта — только активные и только id, email, display_name (user.Brief) —
        для добавления в проект.
      produces:
      - application/json
      responses:
        "200":
          description: администратору; менеджеру — массив user.Brief
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор и не менеджер'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Пользователи
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Пользователь создаётся без пароля, на email уходит письмо со ссылкой
        установки пароля (ТЗ §7.1). timezone по умолчанию Europe/Moscow.
      parameters:
      - description: пользователь
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: VALIDATION_FAILED, в том числе email уже используется
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Создать пользователя
      tags:
      - users
  /api/v1/users/{id}:
    patch:
      consumes:
      - application/json
      description: 'Меняются только переданные поля. Последнего активного администратора
        системы нельзя деактивировать или лишить флага (400, поле is_active / is_system_admin).
        is_active=false — деактивация (ТЗ §3.1): сессии отзываются, привязка Telegram
        снимается; если пользователь — единственный активный менеджер проекта, 409
        LAST_MANAGER со списком проектов в details.projects.'
      parameters:
      - description: id пользователя
        in: path
        name: id
        required: true
        type: string
      - description: поля для изменения
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: LAST_MANAGER
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Изменить пользователя
      tags:
      - users
  /api/v1/worklogs/{id}:
    delete:
      description: Права и сроки — как у правки (§6.5); удаление чужой записи — в
        журнал аудита (§3.8). spent_minutes задачи пересчитывается. Событие worklog.deleted.
      parameters:
      - description: id записи
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: чужая запись или прошло 7 дней'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: 'INVALID_TRANSITION: закрытый спринт; PROJECT_ARCHIVED'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Удалить запись времени
      tags:
      - worklogs
    patch:
      consumes:
      - application/json
      description: |-
        Автор — в течение 7 календарных дней после work_date, менеджер проекта — любую без срока (§6.5). Правка чужой записи пишется в журнал аудита (§3.8).
        Ограничения полей и дневной лимит — как при создании; день и лимит — по поясу владельца записи. Задача закрытого спринта — 409 INVALID_TRANSITION. Событие worklog.updated.
      parameters:
      - description: id записи
        in: path
        name: id
        required: true
        type: string
      - description: изменяемые поля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.worklogPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.WorklogView'
        "400":
          description: INVALID_DURATION, VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: чужая запись или прошло 7 дней'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: DAILY_LIMIT_EXCEEDED, INVALID_TRANSITION, PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Изменить запись времени
      tags:
      - worklogs
  /health:
    get:
      description: Проверяет PostgreSQL и Redis. 200 — всё доступно, 503 — есть недоступный
        компонент.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 'status: degraded'
          schema:
            additionalProperties: true
            type: object
      summary: Состояние сервиса
      tags:
      - system
schemes:
- https
- http
securityDefinitions:
  BearerAuth:
    description: 'JWT access-токен: "Bearer <token>" (ТЗ §9.1)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
