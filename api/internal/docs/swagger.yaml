basePath: /
definitions:
  apierr.Body:
    properties:
      code:
        example: INVALID_TRANSITION
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        example: Переход done → todo не разрешён
        type: string
    type: object
  apierr.Response:
    properties:
      error:
        $ref: '#/definitions/apierr.Body'
    type: object
  auth.SessionResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 900
        type: integer
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/user.User'
    type: object
  auth.loginRequest:
    properties:
      email:
        maxLength: 254
        type: string
      password:
        maxLength: 200
        type: string
    required:
    - email
    - password
    type: object
  auth.passwordResetRequest:
    properties:
      email:
        maxLength: 254
        type: string
    required:
    - email
    type: object
  auth.passwordSetRequest:
    properties:
      password:
        maxLength: 72
        minLength: 10
        type: string
      token:
        maxLength: 200
        type: string
    required:
    - password
    - token
    type: object
  project.MemberView:
    properties:
      display_name:
        type: string
      email:
        type: string
      is_active:
        type: boolean
      role:
        enum:
        - manager
        - member
        type: string
      user_id:
        type: string
    type: object
  project.View:
    properties:
      created_at:
        type: string
      daily_summary_time:
        type: string
      deleted_at:
        format: date-time
        type: string
      description:
        type: string
      id:
        type: string
      is_archived:
        type: boolean
      key:
        type: string
      my_role:
        type: string
      name:
        type: string
      notification_settings:
        additionalProperties:
          type: boolean
        type: object
      telegram_chat_id:
        type: integer
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  project.createRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      key:
        example: TM
        maxLength: 10
        type: string
      name:
        maxLength: 100
        type: string
      timezone:
        example: Europe/Moscow
        maxLength: 64
        type: string
    required:
    - key
    - name
    type: object
  project.putMemberRequest:
    properties:
      role:
        enum:
        - manager
        - member
        type: string
    required:
    - role
    type: object
  project.updateRequest:
    properties:
      daily_summary_time:
        example: "10:00"
        maxLength: 5
        type: string
      description:
        maxLength: 2000
        type: string
      is_archived:
        type: boolean
      name:
        maxLength: 100
        type: string
      notification_settings:
        additionalProperties:
          type: boolean
        type: object
      timezone:
        maxLength: 64
        type: string
    type: object
  user.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_system_admin:
        type: boolean
      notification_settings:
        type: object
      telegram_user_id:
        type: integer
      telegram_username:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  users.createRequest:
    properties:
      display_name:
        description: 1–80 после обрезки пробелов проверяет сервис
        maxLength: 200
        type: string
      email:
        maxLength: 254
        type: string
      is_system_admin:
        type: boolean
      timezone:
        example: Europe/Moscow
        maxLength: 64
        type: string
    required:
    - display_name
    - email
    type: object
  users.updateRequest:
    properties:
      display_name:
        maxLength: 200
        type: string
      is_active:
        type: boolean
      is_system_admin:
        type: boolean
      timezone:
        maxLength: 64
        type: string
    type: object
info:
  contact: {}
  description: Система управления задачами и временем с Telegram-ботом. Единый формат
    ошибок — ТЗ §9.3.
  title: TaskFlow API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Возвращает access-токен (15 минут) и ставит httpOnly cookie refresh_token
        (30 дней). После 10 неудачных попыток вход по email закрыт на 15 минут.
      parameters:
      - description: email и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: 'UNAUTHORIZED: неверный email или пароль, пользователь деактивирован'
          schema:
            $ref: '#/definitions/apierr.Response'
        "429":
          description: 'RATE_LIMITED: вход заблокирован, details.retry_after_seconds'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Вход
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 'Отзывает refresh-токен из cookie и очищает её. Требует X-Requested-With:
        XMLHttpRequest.'
      parameters:
      - description: 'Защита от CSRF: любое значение, например XMLHttpRequest'
        in: header
        name: X-Requested-With
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: 'FORBIDDEN: нет заголовка X-Requested-With'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Выйти
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Выйти везде
      tags:
      - auth
  /api/v1/auth/password-reset:
    post:
      consumes:
      - application/json
      description: Отправляет на email ссылку для установки нового пароля (действует
        24 часа, одноразовая). Ответ всегда 204, даже если такого пользователя нет;
        повторный запрос на тот же email в течение минуты письма не шлёт.
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.passwordResetRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Восстановить пароль
      tags:
      - auth
  /api/v1/auth/password-set:
    post:
      consumes:
      - application/json
      description: 'Токен из ссылки одноразовый: после успешной установки повторно
        не принимается. Все сессии пользователя отзываются.'
      parameters:
      - description: токен из ссылки и новый пароль (не короче 10 символов)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.passwordSetRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: 'VALIDATION_FAILED: пароль короче 10 символов; details.fields[token]
            — ссылка недействительна, использована или истекла'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Задать пароль по ссылке
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: 'Требует cookie refresh_token и заголовок X-Requested-With: XMLHttpRequest
        (защита от CSRF). Старый refresh-токен отзывается.'
      parameters:
      - description: 'Защита от CSRF: любое значение, например XMLHttpRequest'
        in: header
        name: X-Requested-With
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "401":
          description: 'UNAUTHORIZED: сессия истекла или отозвана'
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: нет заголовка X-Requested-With'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Обновить access-токен
      tags:
      - auth
  /api/v1/ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'pong: true'
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Проверка связи
      tags:
      - system
  /api/v1/projects:
    get:
      description: Проекты, где пользователь участник; администратору системы — все.
        По умолчанию — не архивные; archived=true — только архив; deleted=true — только
        удалённые (администратор).
      parameters:
      - description: только архивные
        in: query
        name: archived
        type: boolean
      - description: только удалённые (администратор)
        in: query
        name: deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/project.View'
            type: array
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: deleted=true не администратору'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Проекты
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Ключ — 2–10 заглавных латинских букв, уникален и среди удалённых
        проектов, не меняется. Участников добавляет администратор или менеджер (§9.2,
        участники).
      parameters:
      - description: проект
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/project.View'
        "400":
          description: VALIDATION_FAILED, в том числе ключ занят
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Создать проект
      tags:
      - projects
  /api/v1/projects/{key}:
    delete:
      description: 'Мягкое удаление (§3.2): проект пропадает из списков, бота и отчётов,
        Telegram-группа отключается; данные сохраняются. Восстановление — POST /projects/{key}/restore.'
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Удалить проект
      tags:
      - projects
    get:
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.View'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: 'NOT_FOUND: нет, удалён или пользователь не участник'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Проект
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Менеджер проекта или администратор. Меняются только переданные
        поля; description "" очищает. notification_settings — частичный объект событий
        §8.6 (task_created, task_taken, task_returned, task_review, task_rework, task_accepted,
        task_cancelled, sprint_started, sprint_closed, daily_summary, comment_created).
        смену is_archived — только администратор (то же значение, что сейчас, пропускается).
        В архивном проекте любое изменение, кроме разархивации, — 409 PROJECT_ARCHIVED.
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
      - description: поля для изменения
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.View'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не менеджер; is_archived — не администратор'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Изменить проект
      tags:
      - projects
  /api/v1/projects/{key}/members:
    get:
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/project.MemberView'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: 'NOT_FOUND: нет проекта или пользователь не участник'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Участники проекта
      tags:
      - projects
  /api/v1/projects/{key}/members/{user_id}:
    delete:
      description: Менеджер проекта или администратор (§2). Единственного активного
        менеджера — 409 LAST_MANAGER.
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
      - description: id пользователя
        in: path
        name: user_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не менеджер'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: 'NOT_FOUND: нет проекта или участника'
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: LAST_MANAGER, PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Исключить участника
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Менеджер проекта или администратор (§2). Добавить можно только
        активного пользователя. Понижение единственного активного менеджера — 409
        LAST_MANAGER. В архивном проекте — 409 PROJECT_ARCHIVED.
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
      - description: id пользователя
        in: path
        name: user_id
        required: true
        type: string
      - description: роль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.putMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: роль изменена или не менялась
          schema:
            $ref: '#/definitions/project.MemberView'
        "201":
          description: участник добавлен
          schema:
            $ref: '#/definitions/project.MemberView'
        "400":
          description: VALIDATION_FAILED, в том числе пользователь деактивирован
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не менеджер'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: 'NOT_FOUND: нет проекта или пользователя'
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: LAST_MANAGER, PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Добавить участника или изменить роль
      tags:
      - projects
  /api/v1/projects/{key}/restore:
    post:
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.View'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Восстановить проект
      tags:
      - projects
  /api/v1/users:
    get:
      description: Администратору — все пользователи целиком (user.User). Менеджеру
        проекта — только активные и только id, email, display_name (user.Brief) —
        для добавления в проект.
      produces:
      - application/json
      responses:
        "200":
          description: администратору; менеджеру — массив user.Brief
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор и не менеджер'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Пользователи
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Пользователь создаётся без пароля, на email уходит письмо со ссылкой
        установки пароля (ТЗ §7.1). timezone по умолчанию Europe/Moscow.
      parameters:
      - description: пользователь
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: VALIDATION_FAILED, в том числе email уже используется
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Создать пользователя
      tags:
      - users
  /api/v1/users/{id}:
    patch:
      consumes:
      - application/json
      description: 'Меняются только переданные поля. Последнего активного администратора
        системы нельзя деактивировать или лишить флага (400, поле is_active / is_system_admin).
        is_active=false — деактивация (ТЗ §3.1): сессии отзываются, привязка Telegram
        снимается; если пользователь — единственный активный менеджер проекта, 409
        LAST_MANAGER со списком проектов в details.projects.'
      parameters:
      - description: id пользователя
        in: path
        name: id
        required: true
        type: string
      - description: поля для изменения
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: LAST_MANAGER
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Изменить пользователя
      tags:
      - users
  /health:
    get:
      description: Проверяет PostgreSQL и Redis. 200 — всё доступно, 503 — есть недоступный
        компонент.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 'status: degraded'
          schema:
            additionalProperties: true
            type: object
      summary: Состояние сервиса
      tags:
      - system
schemes:
- https
- http
securityDefinitions:
  BearerAuth:
    description: 'JWT access-токен: "Bearer <token>" (ТЗ §9.1)'
    in: header
