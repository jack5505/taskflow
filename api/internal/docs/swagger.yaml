        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: VERSION_CONFLICT, PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Изменить задачу
      tags:
      - tasks
