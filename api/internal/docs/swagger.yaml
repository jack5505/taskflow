  /api/v1/tasks/{task_key}:
    delete:
      description: 'Мягкое удаление (§4): задача пропадает с доски, из бэклога, поиска
        и бота; записи времени остаются в отчётах. Менеджер проекта или администратор.
        Восстановление — POST /tasks/{key}/restore (администратор).'
      parameters:
      - description: ключ задачи
        in: path
        name: task_key
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не менеджер'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Удалить задачу
      tags:
      - tasks
    get:
      parameters:
      - description: ключ задачи, например TM-42
        in: path
        name: task_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Task'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: 'NOT_FOUND: нет задачи, она удалена или пользователь не участник
            проекта'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Задача
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: 'Меняются только переданные поля; null очищает необязательное поле;
        поле status — 400 (статус меняется через /transition). Заголовок If-Match
        — ETag карточки ("5"), список ETag или *; сравнение сильное, W/"5" — 400.
        Если задачу уже изменили — 409 VERSION_CONFLICT, в details.current актуальная
        задача. Права (§2): автор, исполнитель или менеджер; исполнитель (активный
        участник) и спринт (не завершённый) — только менеджер; задачу из завершённого
        спринта не переносят; оценку задачи, которая была в работе (в том числе потом
        отменённой), — только менеджер. Исполнителя нельзя менять в закрытой задаче
        и снимать с задачи в работе (§4).'
      parameters:
      - description: ключ задачи
        in: path
        name: task_key
        required: true
        type: string
      - description: ETag карточки (версия в кавычках), список ETag или *
        in: header
        name: If-Match
        required: true
        type: string
      - description: поля для изменения
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Task'
        "400":
          description: VALIDATION_FAILED, в том числе нет If-Match, слабый ETag, передан
            status
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: VERSION_CONFLICT, PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Изменить задачу
      tags:
      - tasks
