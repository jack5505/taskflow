basePath: /
definitions:
  apierr.Body:
    properties:
      code:
        example: INVALID_TRANSITION
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        example: Переход done → todo не разрешён
        type: string
    type: object
  apierr.Response:
    properties:
      error:
        $ref: '#/definitions/apierr.Body'
    type: object
  audit.Entry:
    properties:
      action:
        type: string
      actor_id:
        type: string
      created_at:
        type: string
      entity_id:
        type: string
      entity_type:
        type: string
      id:
        type: string
      new_value:
        type: object
      old_value:
        type: object
      project_id:
        type: string
      source:
        enum:
        - web
        - bot
        - cli
        - system
        type: string
    type: object
  audit.Page:
    properties:
      items:
        items:
          $ref: '#/definitions/audit.Entry'
        type: array
      next_cursor:
        type: string
    type: object
  auth.SessionResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 900
        type: integer
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/user.User'
    type: object
  auth.loginRequest:
    properties:
      email:
        maxLength: 254
        type: string
      password:
        maxLength: 200
        type: string
    required:
    - email
    - password
    type: object
  auth.passwordResetRequest:
    properties:
      email:
        maxLength: 254
        type: string
    required:
    - email
    type: object
  auth.passwordSetRequest:
    properties:
      password:
        maxLength: 72
        minLength: 10
        type: string
      token:
        maxLength: 200
        type: string
    required:
    - password
    - token
    type: object
  me.MyProject:
    properties:
      id:
        type: string
      is_archived:
        type: boolean
      key:
        type: string
      name:
        type: string
      role:
        enum:
        - manager
        - member
        type: string
    type: object
  me.Profile:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_system_admin:
        type: boolean
      notification_settings:
        additionalProperties:
          type: boolean
        type: object
      projects:
        items:
          $ref: '#/definitions/me.MyProject'
        type: array
      telegram_user_id:
        type: integer
      telegram_username:
        type: string
      timer:
        type: object
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  me.Update:
    properties:
      display_name:
        maxLength: 200
        type: string
      notification_settings:
        additionalProperties:
          type: boolean
        type: object
      timezone:
        example: Europe/Moscow
        maxLength: 64
        type: string
    type: object
  me.readRequest:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  me.readResponse:
    properties:
      marked:
        type: integer
    type: object
  notification.Notification:
    properties:
      created_at:
        type: string
      id:
        type: string
      payload:
        type: object
      read_at:
        type: string
      task_id:
        type: string
      type:
        type: string
    type: object
  notification.Page:
    properties:
      items:
        items:
          $ref: '#/definitions/notification.Notification'
        type: array
      next_cursor:
        type: string
      unread_count:
        type: integer
    type: object
  project.MemberView:
    properties:
      display_name:
        type: string
      email:
        type: string
      is_active:
        type: boolean
      role:
        enum:
        - manager
        - member
        type: string
      user_id:
        type: string
    type: object
  project.View:
    properties:
      created_at:
        type: string
      daily_summary_time:
        type: string
      deleted_at:
        format: date-time
        type: string
      description:
        type: string
      id:
        type: string
      is_archived:
        type: boolean
      key:
        type: string
      my_role:
        type: string
      name:
        type: string
      notification_settings:
        additionalProperties:
          type: boolean
        type: object
      telegram_chat_id:
        type: integer
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  project.createRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      key:
        example: TM
        maxLength: 10
        type: string
      name:
        maxLength: 100
        type: string
      timezone:
        example: Europe/Moscow
        maxLength: 64
        type: string
    required:
    - key
    - name
    type: object
  project.putMemberRequest:
    properties:
      role:
        description: допустимость проверяет сервис — одно правило и для бота
        enum:
        - manager
        - member
        type: string
    required:
    - role
    type: object
  project.updateRequest:
    properties:
      daily_summary_time:
        example: "10:00"
        maxLength: 5
        type: string
      description:
        maxLength: 2000
        type: string
      is_archived:
        type: boolean
      name:
        maxLength: 100
        type: string
      notification_settings:
        additionalProperties:
          type: boolean
        type: object
      timezone:
        maxLength: 64
        type: string
    type: object
  task.HistoryView:
    properties:
      created_at:
        type: string
      field:
        type: string
      id:
        type: string
      new_value: {}
      note:
        example: снят при деактивации
        type: string
      old_value: {}
      source:
        enum:
        - web
        - telegram
        - api
        type: string
      user_id:
        type: string
    type: object
  task.ListItem:
    properties:
      assignee_id:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      due_date:
        example: "2026-10-31"
        type: string
      estimate_minutes:
        type: integer
      id:
        type: string
      key:
        example: TM-42
        type: string
      labels:
        items:
          type: string
        type: array
      number:
        type: integer
      overdue:
        type: boolean
      position:
        type: number
      priority:
        enum:
        - low
        - medium
        - high
        - critical
        type: string
      project_id:
        type: string
      reporter_id:
        type: string
      spent_minutes:
        type: integer
      sprint_id:
        type: string
      started_at:
        type: string
      status:
        enum:
        - todo
        - in_progress
        - review
        - done
        - cancelled
        type: string
      title:
        type: string
      type:
        enum:
        - task
        - bug
        - feature
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  task.MyTask:
    properties:
      due_date:
        example: "2026-10-31"
        type: string
      estimate_minutes:
        type: integer
      key:
        type: string
      overdue:
        type: boolean
      project_key:
        type: string
      project_name:
        type: string
      spent_minutes:
        type: integer
      sprint_id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  task.Page:
    properties:
      items:
        items:
          $ref: '#/definitions/task.ListItem'
        type: array
      next_cursor:
        type: string
    type: object
  task.Task:
    properties:
      assignee_id:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      due_date:
        example: "2026-10-31"
        type: string
      estimate_minutes:
        type: integer
      id:
        type: string
      key:
        example: TM-42
        type: string
      labels:
        items:
          type: string
        type: array
      number:
        type: integer
      position:
        type: number
      priority:
        enum:
        - low
        - medium
        - high
        - critical
        type: string
      project_id:
        type: string
      reporter_id:
        type: string
      spent_minutes:
        type: integer
      sprint_id:
        type: string
      started_at:
        type: string
      status:
        enum:
        - todo
        - in_progress
        - review
        - done
        - cancelled
        type: string
      title:
        type: string
      type:
        enum:
        - task
        - bug
        - feature
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  task.createRequest:
    properties:
      assignee_id:
        type: string
      description:
        maxLength: 20000
        type: string
      due_date:
        example: "2026-10-31"
        type: string
      estimate_minutes:
        maximum: 60000
        minimum: 1
        type: integer
      labels:
        description: ≤10 по ≤30 после обрезки и без повторов — проверяет сервис
        items:
          type: string
        maxItems: 50
        type: array
      priority:
        enum:
        - low
        - medium
        - high
        - critical
        type: string
      sprint_id:
        type: string
      title:
        maxLength: 200
        type: string
      type:
        enum:
        - task
        - bug
        - feature
        type: string
    required:
    - title
    type: object
  task.transitionRequest:
    properties:
      assignee_id:
        type: string
      comment:
        maxLength: 5000
        type: string
      to:
        enum:
        - todo
        - in_progress
        - review
        - done
        - cancelled
        type: string
    required:
    - to
    type: object
  task.updateRequest:
    properties:
      assignee_id:
        format: uuid
        type: string
        x-nullable: true
      description:
        type: string
        x-nullable: true
      due_date:
        example: "2026-10-31"
        type: string
        x-nullable: true
      estimate_minutes:
        type: integer
        x-nullable: true
      labels:
        items:
          type: string
        type: array
      priority:
        enum:
        - low
        - medium
        - high
        - critical
        type: string
      sprint_id:
        format: uuid
        type: string
        x-nullable: true
      title:
        type: string
      type:
        enum:
        - task
        - bug
        - feature
        type: string
    type: object
  user.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_system_admin:
        type: boolean
      notification_settings:
        type: object
      telegram_user_id:
        type: integer
      telegram_username:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  users.createRequest:
    properties:
      display_name:
        description: 1–80 после обрезки пробелов проверяет сервис
        maxLength: 200
        type: string
      email:
        maxLength: 254
        type: string
      is_system_admin:
        type: boolean
      timezone:
        example: Europe/Moscow
        maxLength: 64
        type: string
    required:
    - display_name
    - email
    type: object
  users.updateRequest:
    properties:
      display_name:
        maxLength: 200
        type: string
      is_active:
        type: boolean
      is_system_admin:
        type: boolean
      timezone:
        maxLength: 64
        type: string
    type: object
info:
  contact: {}
  description: Система управления задачами и временем с Telegram-ботом. Единый формат
    ошибок — ТЗ §9.3.
  title: TaskFlow API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Возвращает access-токен (15 минут) и ставит httpOnly cookie refresh_token
        (30 дней). После 10 неудачных попыток вход по email закрыт на 15 минут.
      parameters:
      - description: email и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: 'UNAUTHORIZED: неверный email или пароль, пользователь деактивирован'
          schema:
            $ref: '#/definitions/apierr.Response'
        "429":
          description: 'RATE_LIMITED: вход заблокирован, details.retry_after_seconds'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Вход
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 'Отзывает refresh-токен из cookie и очищает её. Требует X-Requested-With:
        XMLHttpRequest.'
      parameters:
      - description: 'Защита от CSRF: любое значение, например XMLHttpRequest'
        in: header
        name: X-Requested-With
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: 'FORBIDDEN: нет заголовка X-Requested-With'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Выйти
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Выйти везде
      tags:
      - auth
  /api/v1/auth/password-reset:
    post:
      consumes:
      - application/json
      description: Отправляет на email ссылку для установки нового пароля (действует
        24 часа, одноразовая). Ответ всегда 204, даже если такого пользователя нет;
        повторный запрос на тот же email в течение минуты письма не шлёт.
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.passwordResetRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Восстановить пароль
      tags:
      - auth
  /api/v1/auth/password-set:
    post:
      consumes:
      - application/json
      description: 'Токен из ссылки одноразовый: после успешной установки повторно
        не принимается. Все сессии пользователя отзываются.'
      parameters:
      - description: токен из ссылки и новый пароль (не короче 10 символов)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.passwordSetRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: 'VALIDATION_FAILED: пароль короче 10 символов; details.fields[token]
            — ссылка недействительна, использована или истекла'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Задать пароль по ссылке
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: 'Требует cookie refresh_token и заголовок X-Requested-With: XMLHttpRequest
        (защита от CSRF). Старый refresh-токен отзывается.'
      parameters:
      - description: 'Защита от CSRF: любое значение, например XMLHttpRequest'
        in: header
        name: X-Requested-With
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "401":
          description: 'UNAUTHORIZED: сессия истекла или отозвана'
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: нет заголовка X-Requested-With'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Обновить access-токен
      tags:
      - auth
  /api/v1/me:
    get:
      description: Текущий пользователь, его личные уведомления §8.7 (все ключи, с
        умолчаниями), проекты и роли, запущенный таймер (пока всегда null — появится
        вместе с таймером).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.Profile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Профиль
      tags:
      - me
    patch:
      consumes:
      - application/json
      description: 'Меняются только переданные поля. notification_settings — частичный
        объект личных уведомлений §8.7: assigned, rework, accepted_cancelled, comment,
        review_requested, due, timer_auto_stopped, worklog_trimmed, task_deleted,
        membership.'
      parameters:
      - description: поля профиля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/me.Update'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.Profile'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Изменить профиль
      tags:
      - me
  /api/v1/me/notifications:
    get:
      description: Уведомления колокольчика за 30 дней, новые первыми. unread_count
        — только на первой странице (без cursor). Следующая страница — cursor из next_cursor.
      parameters:
      - description: только непрочитанные
        in: query
        name: unread
        type: boolean
      - description: до 200, по умолчанию 50
        in: query
        name: limit
        type: integer
      - description: курсор следующей страницы
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notification.Page'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Уведомления
      tags:
      - me
  /api/v1/me/notifications/read:
    post:
      consumes:
      - application/json
      description: ids — какие отметить (до 200); без ids или пустой список — все.
        Чужие id игнорируются.
      parameters:
      - description: id уведомлений
        in: body
        name: body
        schema:
          $ref: '#/definitions/me.readRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.readResponse'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Отметить уведомления прочитанными
      tags:
      - me
  /api/v1/me/tasks:
    get:
      description: 'Открытые задачи текущего пользователя по всем его проектам (§7.2),
        по сроку: без срока — в конце, просроченные — сверху.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.MyTask'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Мои задачи
      tags:
      - tasks
  /api/v1/ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'pong: true'
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Проверка связи
      tags:
      - system
  /api/v1/projects:
    get:
      description: Проекты, где пользователь участник; администратору системы — все.
        По умолчанию — не архивные; archived=true — только архив; deleted=true — только
        удалённые (администратор).
      parameters:
      - description: только архивные
        in: query
        name: archived
        type: boolean
      - description: только удалённые (администратор)
        in: query
        name: deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/project.View'
            type: array
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: deleted=true не администратору'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Проекты
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Ключ — 2–10 заглавных латинских букв, уникален и среди удалённых
        проектов, не меняется. Участников добавляет администратор или менеджер (§9.2,
        участники).
      parameters:
      - description: проект
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/project.View'
        "400":
          description: VALIDATION_FAILED, в том числе ключ занят
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
