      security:
      - BearerAuth: []
      summary: Задача
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: 'Меняются только переданные поля; null очищает необязательное поле;
        поле status — 400 (статус меняется через /transition). Заголовок If-Match
        — ETag карточки ("5"), список ETag или *; сравнение сильное, W/"5" — 400.
        Если задачу уже изменили — 409 VERSION_CONFLICT, в details.current актуальная
        задача. Права (§2): автор, исполнитель или менеджер; исполнитель (активный
        участник) и спринт (не завершённый) — только менеджер; задачу из завершённого
        спринта не переносят; оценку задачи, которая была в работе (в том числе потом
        отменённой), — только менеджер. Исполнителя нельзя менять в закрытой задаче
        и снимать с задачи в работе (§4).'
      parameters:
      - description: ключ задачи
        in: path
        name: task_key
        required: true
        type: string
      - description: ETag карточки (версия в кавычках), список ETag или *
        in: header
        name: If-Match
        required: true
        type: string
      - description: поля для изменения
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
