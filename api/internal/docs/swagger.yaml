        maxLength: 2000
        type: string
        x-nullable: true
      duration:
        description: '§6.1: d, h, m от большей к меньшей; 1d = 8h; от 1m до 24h'
        example: 2h 30m
        maxLength: 100
        type: string
      work_date:
        description: по умолчанию сегодня по поясу пользователя
        example: "2026-10-11"
        format: date
        maxLength: 40
        type: string
    type: object
  telegram.LinkCode:
    properties:
      code:
        example: K7M2X9QD
        type: string
      expires_at:
        type: string
      url:
        description: URL — https://t.me/<бот>?start=<код>; пусто, если имя бота не
          задано (TELEGRAM_BOT_USERNAME).
        example: https://t.me/taskflow_bot?start=K7M2X9QD
        type: string
    type: object
  user.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_system_admin:
        type: boolean
      notification_settings:
        type: object
      telegram_user_id:
        type: integer
      telegram_username:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  users.createRequest:
    properties:
      display_name:
        description: 1–80 после обрезки пробелов проверяет сервис
        maxLength: 200
        type: string
      email:
        maxLength: 254
        type: string
      is_system_admin:
        type: boolean
      timezone:
        example: Europe/Moscow
        maxLength: 64
        type: string
    required:
    - display_name
    - email
    type: object
  users.updateRequest:
    properties:
      display_name:
        maxLength: 200
        type: string
      is_active:
        type: boolean
      is_system_admin:
        type: boolean
      timezone:
        maxLength: 64
        type: string
    type: object
info:
  contact: {}
  description: Система управления задачами и временем с Telegram-ботом. Единый формат
    ошибок — ТЗ §9.3.
  title: TaskFlow API
  version: "1.0"
paths:
  /api/v1/attachments/{id}:
    delete:
      description: 'Автор файла или менеджер проекта (§2: чужие — только менеджер).
        Файл удаляется с диска.'
      parameters:
      - description: id вложения
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: чужое вложение'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Удалить вложение
      tags:
      - attachments
    get:
      description: После проверки прав выдаёт ссылку, подписанную на 10 минут (§3.9).
        Ссылка открывается без токена.
      parameters:
      - description: id вложения
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.DownloadLink'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Ссылка на скачивание вложения
      tags:
      - attachments
  /api/v1/attachments/{id}/download:
    get:
      description: |-
        Без токена: доступ по подписи и сроку из ссылки GET /attachments/{id}. Файл отдаётся как
        application/octet-stream с Content-Disposition: attachment и X-Content-Type-Options: nosniff —
        браузер не открывает его как страницу (§3.9).
      parameters:
      - description: id вложения
        in: path
        name: id
        required: true
        type: string
      - description: срок ссылки, unix-время
        in: query
        name: exp
        required: true
        type: integer
      - description: подпись
        in: query
        name: sig
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "403":
          description: 'FORBIDDEN: подпись неверна или срок истёк'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Скачать вложение
      tags:
      - attachments
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Возвращает access-токен (15 минут) и ставит httpOnly cookie refresh_token
        (30 дней). После 10 неудачных попыток вход по email закрыт на 15 минут.
      parameters:
      - description: email и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: 'UNAUTHORIZED: неверный email или пароль, пользователь деактивирован'
          schema:
            $ref: '#/definitions/apierr.Response'
        "429":
          description: 'RATE_LIMITED: вход заблокирован, details.retry_after_seconds'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Вход
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 'Отзывает refresh-токен из cookie и очищает её. Требует X-Requested-With:
        XMLHttpRequest.'
      parameters:
      - description: 'Защита от CSRF: любое значение, например XMLHttpRequest'
        in: header
        name: X-Requested-With
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: 'FORBIDDEN: нет заголовка X-Requested-With'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Выйти
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Выйти везде
      tags:
      - auth
  /api/v1/auth/password-reset:
    post:
      consumes:
      - application/json
      description: Отправляет на email ссылку для установки нового пароля (действует
        24 часа, одноразовая). Ответ всегда 204, даже если такого пользователя нет;
        повторный запрос на тот же email в течение минуты письма не шлёт.
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.passwordResetRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Восстановить пароль
      tags:
      - auth
  /api/v1/auth/password-set:
    post:
      consumes:
      - application/json
      description: 'Токен из ссылки одноразовый: после успешной установки повторно
        не принимается. Все сессии пользователя отзываются.'
      parameters:
      - description: токен из ссылки и новый пароль (не короче 10 символов)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.passwordSetRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: 'VALIDATION_FAILED: пароль короче 10 символов; details.fields[token]
            — ссылка недействительна, использована или истекла'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Задать пароль по ссылке
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: 'Требует cookie refresh_token и заголовок X-Requested-With: XMLHttpRequest
        (защита от CSRF). Старый refresh-токен отзывается.'
      parameters:
      - description: 'Защита от CSRF: любое значение, например XMLHttpRequest'
        in: header
        name: X-Requested-With
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "401":
          description: 'UNAUTHORIZED: сессия истекла или отозвана'
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: нет заголовка X-Requested-With'
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Обновить access-токен
      tags:
      - auth
  /api/v1/comments/{id}:
    delete:
      description: 'Автор комментария или менеджер проекта (§2: чужие — только менеджер).'
      parameters:
      - description: id комментария
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: чужой комментарий'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Удалить комментарий
      tags:
      - comments
    patch:
      consumes:
      - application/json
      description: Автор комментария или менеджер проекта (§3.6).
      parameters:
      - description: id комментария
        in: path
        name: id
        required: true
        type: string
      - description: новый текст
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.commentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.CommentView'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: чужой комментарий'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
        "409":
          description: PROJECT_ARCHIVED
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Изменить комментарий
      tags:
      - comments
  /api/v1/me:
    get:
      description: Текущий пользователь, его личные уведомления §8.7 (все ключи, с
        умолчаниями), проекты и роли, запущенный таймер (пока всегда null — появится
        вместе с таймером).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.Profile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Профиль
      tags:
      - me
    patch:
      consumes:
      - application/json
      description: 'Меняются только переданные поля. notification_settings — частичный
        объект личных уведомлений §8.7: assigned, rework, accepted_cancelled, comment,
        review_requested, due, timer_auto_stopped, worklog_trimmed, task_deleted,
        membership.'
      parameters:
      - description: поля профиля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/me.Update'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.Profile'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Изменить профиль
      tags:
      - me
  /api/v1/me/notifications:
    get:
      description: Уведомления колокольчика за 30 дней, новые первыми. unread_count
        — только на первой странице (без cursor). Следующая страница — cursor из next_cursor.
      parameters:
      - description: только непрочитанные
        in: query
        name: unread
        type: boolean
      - description: до 200, по умолчанию 50
        in: query
        name: limit
        type: integer
      - description: курсор следующей страницы
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notification.Page'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Уведомления
      tags:
      - me
  /api/v1/me/notifications/read:
    post:
      consumes:
      - application/json
      description: ids — какие отметить (до 200); без ids или пустой список — все.
        Чужие id игнорируются.
      parameters:
      - description: id уведомлений
        in: body
        name: body
        schema:
          $ref: '#/definitions/me.readRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.readResponse'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Отметить уведомления прочитанными
      tags:
      - me
  /api/v1/me/tasks:
    get:
      description: 'Открытые задачи текущего пользователя по всем его проектам, кроме
        архивных (§7.2), по сроку: без срока — в конце, просроченные — сверху. Не
        больше 200 самых срочных.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.MyTask'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Мои задачи
      tags:
      - tasks
  /api/v1/me/telegram:
    delete:
      description: Снимает привязку Telegram (§8.1); после этого бот отвечает пользователю
        только на /start. Без привязки — тоже 204.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Отвязать Telegram
      tags:
      - me
  /api/v1/me/telegram-link-code:
    post:
      description: Одноразовый код из 8 символов (латиница и цифры) на 10 минут и
        ссылка https://t.me/<бот>?start=<код> (§8.1). Новый код гасит прежний неиспользованный.
        Маршрут есть, только если бот подключён (telegram_bot_enabled в GET /me),
        иначе 404.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/telegram.LinkCode'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: бот не подключён
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Код привязки Telegram
      tags:
      - me
  /api/v1/me/timer/stop:
    post:
      description: |-
        Запись времени source = timer, длительность округляется вверх до минуты; меньше минуты — записи нет. Через полночь по поясу пользователя — две записи на разные даты.
        Запись сверх дневного лимита 24 часа обрезается до остатка (trimmed, событие timer.trimmed), остатка нет — записи нет (§6.4).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.TimerStop'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: 'NOT_FOUND: таймер не запущен'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Остановить таймер
      tags:
      - timer
  /api/v1/ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'pong: true'
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Проверка связи
      tags:
      - system
  /api/v1/projects:
    get:
      description: Проекты, где пользователь участник; администратору системы — все.
        По умолчанию — не архивные; archived=true — только архив; deleted=true — только
        удалённые (администратор). В карточке — активный спринт (null, если нет),
        число открытых задач (todo, in_progress, review) и открытых задач на текущем
        пользователе (§7.2).
      parameters:
      - description: только архивные
        in: query
        name: archived
        type: boolean
      - description: только удалённые (администратор)
        in: query
        name: deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/project.ListItem'
            type: array
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: deleted=true не администратору'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Проекты
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Ключ — 2–10 заглавных латинских букв, уникален и среди удалённых
        проектов, не меняется. Участников добавляет администратор или менеджер (§9.2,
        участники).
      parameters:
      - description: проект
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/project.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/project.View'
        "400":
          description: VALIDATION_FAILED, в том числе ключ занят
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Создать проект
      tags:
      - projects
  /api/v1/projects/{key}:
    delete:
      description: 'Мягкое удаление (§3.2): проект пропадает из списков, бота и отчётов,
        Telegram-группа отключается; данные сохраняются. Восстановление — POST /projects/{key}/restore.'
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "403":
          description: 'FORBIDDEN: не администратор системы'
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Удалить проект
      tags:
      - projects
    get:
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.View'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: 'NOT_FOUND: нет, удалён или пользователь не участник'
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Проект
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Менеджер проекта или администратор. Меняются только переданные
        поля; description "" очищает. notification_settings — частичный объект событий
        §8.6 (task_created, task_taken, task_returned, task_review, task_rework, task_accepted,
        task_cancelled, sprint_started, sprint_closed, daily_summary, comment_created).
        смену is_archived — только администратор (то же значение, что сейчас, пропускается).
        В архивном проекте любое изменение, кроме разархивации, — 409 PROJECT_ARCHIVED.
      parameters:
      - description: ключ проекта
        in: path
        name: key
        required: true
        type: string
