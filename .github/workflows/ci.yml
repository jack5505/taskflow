name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - name: Swagger в репозитории совпадает с аннотациями (make swag)
        run: |
          sh scripts/swag.sh
          git diff --exit-code -- internal/docs
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6
          working-directory: api
      - name: Тесты и порог покрытия 80% (ТЗ §10.4)
        run: sh scripts/coverage.sh coverage.out

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TypeScript-клиент совпадает со swagger.json (make web-gen-api)
        run: |
          npm run gen:api
          git diff --exit-code -- src/api
      - run: npm run lint
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: taskflow:ci
