name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - name: Swagger в репозитории совпадает с аннотациями (make swag)
        run: |
          sh scripts/swag.sh
          git diff --exit-code -- internal/docs
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6
          working-directory: api
      - name: Тесты и порог покрытия 80% (ТЗ §10.4)
        run: sh scripts/coverage.sh coverage.out

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TypeScript-клиент совпадает со swagger.json (make web-gen-api)
        run: |
          npm run gen:api
          git diff --exit-code -- src/api
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scripts:
    name: Скрипты (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x -s bash deploy/*.sh web/e2e/*.sh loadtest/*.sh && shellcheck -s sh api/scripts/*.sh
      # Сам нагрузочный тест в CI не гоняется: генерация данных и прогон k6 — минуты на стенде
      # (loadtest/run.sh). Здесь только разбор сценария и опций — ошибка синтаксиса видна сразу.
      - name: Сценарий k6 разбирается (loadtest/k6.js)
        run: docker run --rm -v "$PWD/loadtest:/scripts:ro" grafana/k6:2.3.0 inspect /scripts/k6.js > /dev/null

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: taskflow:ci

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Браузер Chromium той же версии, что @playwright/test
        run: npx playwright install --with-deps chromium
      - name: Стенд из исходников и администраторы (e2e/stack.sh)
        run: e2e/stack.sh up >> "$GITHUB_ENV"
      - name: Сценарии приёмки ТЗ §10.4
        run: npm run e2e
      - name: Логи стенда при падении
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color api worker
      - name: Отчёт и трейсы Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Убрать стенд
        if: always()
        run: e2e/stack.sh down
