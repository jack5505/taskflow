# Релиз по git-тегу vX.Y.Z (CONTRIBUTING §8): образ в GHCR + GitHub Release.
# Выкладка на стенд — вручную на сервере: deploy/deploy.sh vX.Y.Z
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Образ в GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # история и теги нужны для списка изменений с прошлого релиза
          fetch-tags: true
      - name: Список закрытых issues и PR с прошлого тега
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          range=${prev:+$prev..}${{ github.ref_name }}
          {
            echo "Образ: \`ghcr.io/${{ github.repository }}:${{ github.ref_name }}\`"
            echo
            echo "Выкладка на стенд: \`deploy/deploy.sh ${{ github.ref_name }}\`"
            echo
            echo "## Изменения"
            git log --no-merges --pretty='- %s' "$range"
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
