# TaskFlow (~/taskflow). Копируется в ~/mahalla-dev/nginx/extra/ и подключается через include;
# render.sh этот файл не трогает. Сертификат — в certs/, продлевает общий renew.sh.
# Контейнер taskflow-api доступен по сети taskflow_default: nginx к ней подключён
# (docker network connect taskflow_default mahalla-dev-nginx, см. deploy/README.md).
server {
    listen 80;
    server_name tasks.157.173.109.181.nip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name tasks.157.173.109.181.nip.io;
    ssl_certificate     /etc/letsencrypt/live/tasks.157.173.109.181.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasks.157.173.109.181.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    # Вложения до 50 МБ (ТЗ §3.9) + запас на multipart.
    client_max_body_size 52m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        set $taskflow taskflow-api:8080;
        proxy_pass         http://$taskflow;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
