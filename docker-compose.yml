# Стенд TaskFlow (ТЗ §10.2). Локально образ собирается из исходников (taskflow:local),
# на сервере deploy/deploy.sh подставляет TASKFLOW_IMAGE=ghcr.io/jack5505/taskflow:<тег>.
# Имена контейнеров не фиксированы: копия стенда с другим COMPOSE_PROJECT_NAME и TASKFLOW_PORT
# может жить рядом (проверка восстановления). nginx сервера ходит на alias taskflow-api в сети стенда.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${TASKFLOW_IMAGE:-taskflow:local}
    command: ["api"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    env_file: .env
    ports:
      - "127.0.0.1:${TASKFLOW_PORT:-8100}:8080"
    networks:
      default:
        aliases: [taskflow-api]
    volumes:
      - attachments:/data/attachments
      - ./secrets:/run/secrets:ro # ключ GitHub App (GITHUB_APP_PRIVATE_KEY_FILE)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${TASKFLOW_IMAGE:-taskflow:local}
    command: ["worker"]
    env_file: .env
    volumes:
      - attachments:/data/attachments
      - ./secrets:/run/secrets:ro # ключ GitHub App (GITHUB_APP_PRIVATE_KEY_FILE)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  attachments:
